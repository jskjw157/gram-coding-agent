name: snapshot-backlog
on:
  pull_request:
    paths:
      - '.github/workflows/snapshot-backlog.yml'

permissions:
  contents: write
  issues: read

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Snapshot approved backlog
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 200 --json number,title,body > /tmp/issues.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          issues = json.loads(Path('/tmp/issues.json').read_text())
          items = [
              {'number': i['number'], 'title': i['title'], 'body': i.get('body') or ''}
              for i in issues if 1 <= i['number'] <= 130
          ]
          items.sort(key=lambda x: x['number'])
          expected = list(range(1, 131))
          actual = [i['number'] for i in items]
          if actual != expected:
              raise SystemExit(f'expected approved issues #1-#130, got {actual}')
          Path('scripts/github-backlog.json').write_text(
              json.dumps({'version': 1, 'issues': items}, ensure_ascii=False, indent=2) + '\n'
          )
          PY
      - name: Commit manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/github-backlog.json
          git commit -m 'chore: snapshot approved github backlog'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
