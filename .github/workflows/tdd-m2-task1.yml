name: tdd-m2-task1
on:
  push:
    branches: [feat/m2-vertical-slice]
    paths:
      - 'packages/task-engine/**'
      - '.github/workflows/tdd-m2-task1.yml'

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2-vertical-slice
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Refresh lockfile for new workspace package
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add pnpm-lock.yaml
            git commit -m 'chore: update lockfile for task engine'
            git push origin HEAD:feat/m2-vertical-slice
          fi
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Run Task 1 contract
        run: pnpm --filter @gram/task-engine test
