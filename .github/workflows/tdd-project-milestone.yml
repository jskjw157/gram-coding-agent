name: tdd-project-milestone
on:
  pull_request:
    paths:
      - 'scripts/github-backlog.sh'
      - '.github/workflows/tdd-project-milestone.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert repo milestones are not treated as Project single-select
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('scripts/github-backlog.sh', 'utf8');
          if (!source.includes('gh issue edit "$actual" --repo "$REPO" --milestone "$milestone"')) {
            throw new Error('repo milestone assignment is missing');
          }
          if (source.includes('set_project_field "$item_id" \'Milestone\'')) {
            throw new Error('Milestone must not be edited as a Project single-select');
          }
          if (source.includes('ensure_single_select_field "$PROJECT_NUMBER" \'Milestone\'')) {
            throw new Error('Milestone custom single-select must not be created implicitly');
          }
          for (const title of [
            'M0 — Architecture & Repository Foundation',
            'M1 — Secure Agent Runtime',
            'M2 — First End-to-End Coding Task',
            'M3 — Reliability & Recovery',
            'M4 — Windows Integration & Developer UX',
            'M5 — Hardening & Production Readiness',
          ]) {
            if (!source.includes(title)) throw new Error(`missing repo milestone title: ${title}`);
          }
          NODE
