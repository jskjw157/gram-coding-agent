name: macos-lifecycle
on:
  pull_request:
    paths:
      - 'packages/macos-lifecycle/**'
      - 'platform/macos/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'vitest.config.mts'
      - 'eslint.config.mjs'
      - '.github/workflows/macos-lifecycle.yml'
      - 'docs/operations/macos-service-lifecycle.md'
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify native runtime
        shell: bash
        run: |
          node -e "console.log(JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})); if(process.platform==='darwin' && process.arch!=='arm64') process.exit(1)"
      - name: Frozen install in an isolated exact-head worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/mac02" HEAD
          cd "$RUNNER_TEMP/mac02"
          pnpm install --frozen-lockfile
          python3 - <<'PY'
          import pathlib, subprocess
          before = subprocess.check_output(['git', 'show', 'HEAD:pnpm-lock.yaml'])
          after = pathlib.Path('pnpm-lock.yaml').read_bytes()
          empty = b'  packages/macos-lifecycle: {}\n\n'
          assert after == before or (after.count(empty) == 1 and after.replace(empty, b'', 1) == before), 'unrelated lockfile change'
          print('Locked resolutions unchanged; only an empty workspace importer may be normalized.')
          PY
      - name: Behavioral tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mac02"
          pnpm --filter @gram/macos-lifecycle test > "$RUNNER_TEMP/mac02-tests.log" 2>&1 || { tail -120 "$RUNNER_TEMP/mac02-tests.log"; exit 1; }
          tail -22 "$RUNNER_TEMP/mac02-tests.log"
      - name: Root lint types tests and build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mac02"
          pnpm lint
          pnpm typecheck
          pnpm test > "$RUNNER_TEMP/mac02-root-tests.log" 2>&1 || { tail -160 "$RUNNER_TEMP/mac02-root-tests.log"; exit 1; }
          tail -22 "$RUNNER_TEMP/mac02-root-tests.log"
          pnpm build
          git diff --check
          test ! -d packages/macos-lifecycle/dist/test-support
          test -z "$(find packages/macos-lifecycle/dist -name '*.test.js' -print)"
      - name: Validate compiled renderer output without installing it
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mac02"
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { parseConfig, renderPlist } from './packages/macos-lifecycle/dist/index.js';
          const dir = join(process.env.RUNNER_TEMP, 'mac02-plists');
          mkdirSync(dir, { recursive: true });
          const base = { schemaVersion: 1, mode: 'LAB_ONLY', runtimeUser: 'gram-agent',
            releaseId: 'lab-001', releaseDigest: 'a'.repeat(64), tunnel: { enabled: false } };
          writeFileSync(join(dir, 'core.plist'), renderPlist(parseConfig(base), 'core'));
          writeFileSync(join(dir, 'tunnel.plist'), renderPlist(parseConfig({ ...base,
            tunnel: { enabled: true, compatibilityDigest: 'b'.repeat(64), credentialRef: 'test-tunnel-key' }
          }), 'tunnel'));
          JS
          python3 platform/macos/tests/verify-plist.py "$RUNNER_TEMP/mac02-plists"
      - name: Native Apple plist syntax check only
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /usr/bin/plutil -lint "$RUNNER_TEMP/mac02-plists/core.plist" "$RUNNER_TEMP/mac02-plists/tunnel.plist"
