name: macos-lifecycle
on:
  pull_request:
    paths: ['packages/macos-lifecycle/**', 'platform/macos/**', 'pnpm-lock.yaml', '.github/workflows/macos-lifecycle.yml', 'docs/operations/macos-service-lifecycle.md']
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Frozen install in an isolated exact-head worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/mac02" HEAD
          cd "$RUNNER_TEMP/mac02"
          pnpm install --frozen-lockfile
          python3 - <<'PY'
          import pathlib, subprocess
          before = subprocess.check_output(['git', 'show', 'HEAD:pnpm-lock.yaml'])
          after = pathlib.Path('pnpm-lock.yaml').read_bytes()
          empty = b'  packages/macos-lifecycle: {}\n\n'
          assert after == before or (after.count(empty) == 1 and after.replace(empty, b'', 1) == before), 'unrelated lockfile change'
          print('Locked resolutions unchanged; only an empty workspace importer may be normalized.')
          PY
      - name: Behavioral tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP/mac02"
          pnpm --filter @gram/macos-lifecycle test
      - name: Package checks and root regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mac02"
          pnpm --filter @gram/macos-lifecycle lint
          pnpm --filter @gram/macos-lifecycle typecheck
          pnpm --filter @gram/macos-lifecycle build
          pnpm exec vitest run --project macos-lifecycle
          pnpm test
          git diff --check
