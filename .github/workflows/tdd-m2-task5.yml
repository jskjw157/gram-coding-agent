name: tdd-m2-task5
on:
  push:
    branches: [feat/m2-vertical-slice]
    paths:
      - 'packages/shell/**'
      - 'packages/persistence/**'
      - '.github/workflows/tdd-m2-task5.yml'

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2-vertical-slice
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Refresh lockfile for Task 5 workspace changes
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add pnpm-lock.yaml
            git commit -m 'chore: update lockfile for m2 task5'
            git push origin HEAD:feat/m2-vertical-slice
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gram/shell test
