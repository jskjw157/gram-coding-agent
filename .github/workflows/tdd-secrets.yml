name: tdd-secrets
on:
  pull_request:
    paths:
      - 'packages/secrets/**'
      - '.github/workflows/tdd-secrets.yml'

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @gram/secrets test
