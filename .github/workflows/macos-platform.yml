name: macos-platform
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: macos-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform-tdd:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare isolated worktree
        run: |
          git worktree add --detach "$RUNNER_TEMP/mac01-feature" HEAD
      - name: Frozen install and package tests
        run: |
          cd "$RUNNER_TEMP/mac01-feature"
          pnpm install --frozen-lockfile
          pnpm --filter @gram/platform test
      - name: Package lint, types, build and root project collection
        run: |
          cd "$RUNNER_TEMP/mac01-feature"
          pnpm --filter @gram/platform lint
          pnpm --filter @gram/platform typecheck
          pnpm --filter @gram/platform build
          pnpm exec vitest run --project platform
          git diff --check
      - name: Execute compiled Linux diagnostic and verify its honest exit status
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mac01-feature"
          code=0
          node packages/platform/dist/cli.js --json > "$RUNNER_TEMP/mac01-diagnostic.json" || code=$?
          test "$code" -eq 2
          node --input-type=module - "$RUNNER_TEMP/mac01-diagnostic.json" <<'JS'
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (r.mode !== 'DIAGNOSTIC_ONLY' || r.liveProbesCollected !== false ||
              r.platform.kind !== 'unsupported' ||
              Object.values(r.capabilities).some(v => v.status !== 'UNSUPPORTED')) process.exit(1);
          console.log(JSON.stringify(r));
          JS
