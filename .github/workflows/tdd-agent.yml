name: tdd-agent
on:
  pull_request:
    paths:
      - 'apps/agent/**'
      - 'packages/observability/**'
      - '.github/workflows/tdd-agent.yml'

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @gram/observability test
      - run: pnpm --filter @gram/agent test
