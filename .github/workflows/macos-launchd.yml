name: macos-launchd
on:
  pull_request:
  push:
    branches: [feat/macos-launchd-composition]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: plutil -lint platform/macos/launchd/com.haar.gram-agent.core.plist
      - run: plutil -lint platform/macos/launchd/com.haar.gram-agent.tunnel.plist
      - run: zsh -n platform/macos/launchd/run-tunnel.sh
      - run: bash -n platform/macos/launchd/run-tunnel.sh
