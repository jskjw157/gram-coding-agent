name: tdd-ops
on:
  pull_request:
    paths:
      - 'tests/ops/**'
      - 'config/tunnel-client.example.yaml'
      - 'systemd/**'
      - 'scripts/bootstrap-wsl.sh'
      - 'docs/operations/tunnel-setup.md'
      - '.github/workflows/tdd-ops.yml'

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/ops/systemd-contract.test.ts
      - run: bash -n scripts/bootstrap-wsl.sh
