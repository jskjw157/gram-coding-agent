name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare mandatory Linux security profile
        run: bash scripts/prepare-security-ci.sh
      - run: bash -n scripts/*.sh
      - run: python3 -m json.tool scripts/github-backlog.json >/dev/null
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm test:security
      - run: pnpm build
