name: tdd-project-rate-limit
on:
  pull_request:
    paths:
      - 'scripts/github-backlog.sh'
      - 'scripts/github-status-sync.sh'
      - '.github/workflows/tdd-project-rate-limit.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert cached item resolution and rate-limit resume
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['scripts/github-backlog.sh', 'scripts/github-status-sync.sh']) {
            const source = fs.readFileSync(file, 'utf8');
            const itemListCount = (source.match(/project item-list/g) || []).length;
            if (itemListCount !== 1) throw new Error(`${file}: expected exactly one full project item-list, found ${itemListCount}`);
            if (!source.includes('PROJECT_ITEMS_JSON=')) throw new Error(`${file}: missing run-scoped Project item cache`);
            if (!source.includes('projectItems(first:20)')) throw new Error(`${file}: missing lightweight issue projectItems fallback`);
            if (!source.includes('--format json')) throw new Error(`${file}: item-add must return JSON so the new item ID can be reused`);
            if (!source.includes('resources.graphql.reset')) throw new Error(`${file}: missing GraphQL reset-time lookup`);
            if (!source.includes('rate limit exceeded')) throw new Error(`${file}: missing rate-limit detection`);
            if (!source.includes('sleep "$wait_seconds"')) throw new Error(`${file}: missing automatic wait-until-reset`);
            if (source.includes('$(ensure_project_item')) throw new Error(`${file}: ensure_project_item must not run in command substitution because cache mutations would be lost in a subshell`);
            if (!source.includes('ENSURE_ITEM_ID=')) throw new Error(`${file}: missing parent-shell item result variable`);
          }
          NODE
